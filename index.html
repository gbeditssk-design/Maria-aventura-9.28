<script>
const $=i=>document.getElementById(i),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),sn=Math.sin,rng=s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
let save={lvl:1,coins:0,hi:0,score:0,music:1,sfx:1};
try{Object.assign(save,JSON.parse(localStorage.getItem('ma100')||'{}'))}catch(e){}

addEventListener('pagehide',store);document.addEventListener('visibilitychange',()=>{store();if(document.hidden)pause()});

/* ===== ÁUDIO (sintetizado, agendado à parte: não trava o jogo) ===== */
let AC,mg,mus,nb,e8=0,nT=0,bossM=0;
function ac(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.connect(AC.destination);mus=AC.createGain();mus.gain.value=.5;mus.connect(mg);nb=AC.createBuffer(1,4410,44100);const d=nb.getChannelData(0);for(let i=0;i<4410;i++)d[i]=Math.random()*2-1}if(AC.resume)AC.resume()}catch(e){}}
function tn(f,t,d,ty,v,f2,o){if(!AC||(!o&&!save.sfx))return;const T=AC.currentTime+t,os=AC.createOscillator(),g=AC.createGain();os.type=ty||'square';os.frequency.setValueAtTime(f,T);if(f2)os.frequency.exponentialRampToValueAtTime(f2,T+d);g.gain.setValueAtTime(v||.12,T);g.gain.exponentialRampToValueAtTime(.001,T+d);os.connect(g);g.connect(o||mg);os.start(T);os.stop(T+d+.05)}

const arp=(a,ty,dl)=>a.forEach((f,i)=>tn(f,i*dl,dl*2,ty,.18));
const sfx={jump:()=>tn(300,0,.18,'square',.09,720),coin:()=>{tn(988,0,.07,'square',.09);tn(1319,.07,.2,'square',.09)},stomp:()=>{tn(220,0,.15,'sawtooth',.16,60);ns(0,.1,.2)},hit:()=>tn(240,0,.35,'sawtooth',.16,70),brk:()=>ns(0,.2,.3),fire:()=>{ns(0,.15,.2);tn(600,0,.15,'square',.07,200)},pow:()=>arp([523,659,784,1047,1319],'square',.06),win:()=>arp([523,659,784,1047,784,1047,1319],'triangle',.12),lose:()=>arp([392,330,262,196],'triangle',.18),die:()=>tn(500,0,.7,'square',.12,80)};
const MEL=[[4,-1,5,6,-1,5,4,-1],[3,-1,4,5,-1,4,2,-1],[2,-1,3,4,-1,6,5,-1],[4,-1,2,3,-1,2,0,-1]];
function mstep(e,T){const bar=e>>3,i=e&7,R=bossM?[9,9,5,7]:[0,9,5,7],sc=bossM?[0,3,5,7,10]:[0,2,4,7,9],t=T-AC.currentTime+(i&1?.045:0),r=R[bar];
 if(i%2==0)tn(65.4*2**((r+(i%4?7:0))/12),t,.22,'triangle',.3,0,mus);
 if(i%4==0||i==6||(bossM&&i%2==0))tn(130,t,.12,'sine',.5,40,mus);
 if(i&1)ns(t,.04,.1,mus);
 const m=MEL[bar][i];if(m>=0)tn(261.63*2**((r+sc[m%5]+12*Math.floor(m/5))/12),t,.2,bossM?'sawtooth':'square',.06,0,mus)}
setInterval(()=>{if(!AC)return;if(!save.music||(state!='play'&&state!='menu')){nT=0;return}
 if(nT<AC.currentTime)nT=AC.currentTime+.05;const sp=60/(bossM?150:128)/2;while(nT<AC.currentTime+.3){mstep(e8%32,nT);e8++;nT+=sp}},100);

/* ===== CANVAS ===== */
const cv=$('c'),c=cv.getContext('2d');let W=480,VW=30,gL;
function rs(){W=Math.max(480,Math.round(270*innerWidth/innerHeight));VW=W/16;cv.width=W;cv.height=270;c.imageSmoothingEnabled=false;gL=c.createRadialGradient(W*.8,0,10,W*.8,0,W*.9);gL.addColorStop(0,'rgba(255,240,170,.32)');gL.addColorStop(1,'rgba(255,240,170,0)')}
addEventListener('resize',rs);rs();
const BI=[{t:'#4aa8ff',b:'#d8f3ff',m:'#5d7fa8',g:'#3fbf3f',d:'#8a5a2b',l:'#2e9e3a'},{t:'#ff8a5c',b:'#ffe0a3',m:'#9a5a6a',g:'#9cb83a',d:'#7a4a28',l:'#e0702a'},{t:'#7fb8f5',b:'#f2fbff',m:'#9bb3cc',g:'#d9eef7',d:'#7a8fa8',l:'#3f8f6a'},{t:'#f5a63c',b:'#ffe9a8',m:'#c08a4a',g:'#d9b45a',d:'#a8743a',l:'#7f9a3a'},{t:'#161c48',b:'#4a4f8f',m:'#2b3470',g:'#2f9e6a',d:'#4a3a5a',l:'#1f7a5a'},{t:'#3cc4ba',b:'#d4fff0',m:'#3a8f8f',g:'#5fd16a',d:'#7a5a3a',l:'#2fb36a'}];
let B=BI[0],sol=[],cn=[],en=[],it=[],fb=[],pt=[],cp=[],hid=[],goalX=100,arena=null,bossLv=0,bd=0,lvl=1,lives=3,score=0,state='menu',tt=0,cam=-6;
let pl={},inp={l:0,r:0,j:0,jp:false,pw:0},pw={s:0,f:0,v:0,h:0},slot=null;

/* ===== NÍVEIS: 100 mapas por semente, 6 biomas, chefe de 10 em 10 ===== */
function build(n){
 const r=rng(n*7919+13),d=(n-1)/99,len=60+n*1.1;B=BI[(n-1)%6];bossLv=n%10==0;bossM=bossLv?1:0;bd=0;arena=null;
 sol=[];cn=[];en=[];it=[];fb=[];pt=[];cp=[];hid=[];pw={s:0,f:0,v:0,h:0};slot=null;
 const G=(x,w)=>sol.push({x,y:-3,w,h:3,t:'g'}),S=(x,y,w,h,t,i)=>sol.push({x,y,w,h,t,i,b:0}),K=(x,y)=>cn.push({x,y,g:0}),KR=(a,b,y)=>{for(let x=a;x<=b;x+=1.3)K(x,y)},
 pick=()=>{const q=r();return q<.4?'c':q<.55?'m':q<.7?'f':q<.8?'s':q<.9?'v':'h'},
 E=(x,y,t)=>en.push({x,y,w:t=='B'?2.4:.9,h:t=='B'?2.6:t=='f'?.8:.9,vx:0,vy:0,t,dir:r()<.5?1:-1,sp:1.2+d*1.8,dead:0,tm:r()*6,ox:x,oy:y,ground:null,hp:t=='B'?3+Math.floor(n/10):1,inv:0,jt:2,st:2});
 let x=-6,cpd=0;G(-6,16);x=12+d*1.5;
 while(x<len){const w=Math.floor(7+r()*5+d*2),mid=x+w/2,k=r();G(x,w);
  if(!cpd&&x>len/2){cp.push({x:x+2,on:0});cpd=1}
  if(k<.25){const h=1+d*.7+r()*.3;S(mid-.5,0,1,h,'b');K(mid,h+1.3);KR(x+1,mid-2.5,.9);S(x+1.5,2.3,1,1,'q',pick());if(r()<d)E(x+3,0,'w')}
  else if(k<.5){const pw_=3+r()*2;S(mid-pw_/2,2.3,pw_,.4,'p');KR(mid-pw_/2+.5,mid+pw_/2-.5,3.5);KR(x+1,x+2.5,.9)}
  else{const t=r();let ty='w';if(n>=8&&t<.25+d*.3)ty='s';else if(n>=4&&t>.8)ty='f';else if(n>=12&&t>.6)ty='j';
   if(ty=='f')E(mid,2.8,'f');else E(x+w*.6,0,ty);if(n>=15&&r()<d)E(x+2.5,0,'w');
   S(x+1.5,2.3,1,1,'q',pick());hid.push({x:mid-.5,y:2.3,w:1,h:1});if(w>=9){S(x+w-3,2.3,1,1,'r');S(x+w-2,2.3,1,1,'r')}KR(x+1,x+w-1,.9)}
  x+=w;if(x<len)x+=2+d*2.2+r()*.6}
 if(bossLv){G(x,30);arena={x,w:30};E(x+20,0,'B');goalX=x+28}else{G(x,16);goalX=x+10}
}

/* ===== FÍSICA ===== */
const ov_=(o,s)=>o.x-o.w/2<s.x+s.w&&o.x+o.w/2>s.x&&o.y<s.y+s.h&&o.y+o.h>s.y;
function mv(o,dt){let wall=false;o.hh=null;o.x+=o.vx*dt;
 for(const s of sol)if(ov_(o,s)){const up=s.y+s.h-o.y;if(o.step&&o.vy<=0&&up>0&&up<.25){o.y=s.y+s.h;continue}
  if(o.vx>0)o.x=s.x-o.w/2-1e-4;else if(o.vx<0)o.x=s.x+s.w+o.w/2+1e-4;wall=true}
 o.y+=o.vy*dt;o.ground=null;
 for(const s of sol)if(ov_(o,s)){if(o.vy<=0){o.y=s.y+s.h;o.ground=s}else{o.y=s.y-o.h;o.hh=s}o.vy=0}
 return wall}
const solidAt=(x,y)=>sol.some(s=>x>s.x&&x<s.x+s.w&&y>s.y&&y<s.y+s.h);
function spark(x,y,n,col,sp){for(let i=0;i<n&&pt.length<140;i++)pt.push({x,y,vx:(Math.random()-.5)*(sp||6),vy:Math.random()*(sp||6),l:.6,m:.6,c:col,s:2})}
function txt(x,y,s){pt.push({x,y,vx:0,vy:2.5,l:.9,m:.9,tx:s,g:0})}
function resetP(){pl={x:0,y:.05,vx:0,vy:0,w:.7,h:1.5,big:false,ground:null,coy:0,buf:0,sq:0,fc:1,run:0,inv:0,safe:null,step:true,dd:0,cd:0,hp:0,hurtT:0}}
const hud=()=>{$('hl').textContent='FASE '+lvl+'/100';$('hc').textContent='🪙 '+save.coins;$('hv').textContent='❤'.repeat(Math.max(0,lives))+'♡'.repeat(Math.max(0,3-lives));$('hs').textContent='★ '+score;$('bm').textContent=save.music?'♪':'✕'};
function die(){if(pl.dd>0)return;lives--;pl.dd=1.5;pl.vy=11;pl.vx=0;sfx.die();hud()}
function resp(){const f=cp.find(f=>f.on),g=pl.safe;pl.x=f?f.x:(g?g.x+1.5:0);pl.y=.05;pl.vx=pl.vy=0;pl.inv=2;pl.dd=0;pl.big=false;pl.h=1.5}
function hurtP(){if(pw.s>0||pl.inv>0||pl.dd>0)return;if(pw.h>0){pw.h=0;pl.inv=1.2;sfx.hit();spark(pl.x,pl.y+1,10,'#6cf');return}
 if(pl.big){pl.big=false;pl.h=1.5;pl.inv=2;sfx.hit();return}die()}
function give(t){sfx.pow();spark(pl.x,pl.y+1,12,'#fff');
 if(t=='m'){if(!pl.big){pl.big=true;pl.h=2.1;if(sol.some(s=>ov_(pl,s))){pl.big=false;pl.h=1.5}}score+=50;txt(pl.x,pl.y+2,'GRANDE!')}else slot=t}
function use(){if(pw.f>0){if(pl.cd<=0&&fb.filter(f=>!f.h).length<3){fb.push({x:pl.x+pl.fc*.5,y:pl.y+pl.h*.6,vx:pl.fc*10,vy:2,l:2.5,h:0});pl.cd=.3;sfx.fire()}}
 else if(slot){const k=slot;slot=null;pw[k]=k=='s'?8:k=='f'?20:k=='v'?12:15;sfx.pow();spark(pl.x,pl.y+1,16,k=='f'?'#f80':k=='v'?'#ff0':k=='h'?'#6cf':'#fff')}}
function bump(s){s.b=.2;if(s.t=='q'){s.t='u';if(s.i=='c'){save.coins++;score+=10;sfx.coin();txt(s.x+.5,s.y+1.4,'+10');spark(s.x+.5,s.y+1,6,'#fc0')}else it.push({x:s.x+.5,y:s.y+1.1,vx:2,vy:7,w:.6,h:.6,t:s.i,ground:null});sfx.brk()}
 else if(s.t=='r'){sol.splice(sol.indexOf(s),1);score+=5;sfx.brk();spark(s.x+.5,s.y+.5,10,'#c64',7)}}
function killE(e,pts){if(e.t=='B'){if(e.inv>0)return;e.hp--;e.inv=.9;sfx.stomp();spark(e.x,e.y+1.3,12,'#f55');if(e.hp<=0){e.dead=1.2;bd=1;score+=1000;spark(e.x,e.y+1.3,40,'#fc0',12);sfx.win();txt(e.x,e.y+3,'CHEFE DERROTADO!')}return}
 e.dead=.5;score+=pts||100;sfx.stomp();spark(e.x,e.y+.4,8,'#ddd');txt(e.x,e.y+1.2,'+'+(pts||100))}
const STEP=1/90;
function step(dt){
 if(pl.dd>0){pl.dd-=dt;pl.vy-=26*dt;pl.y+=pl.vy*dt;if(pl.dd<=0){if(lives<=0)lose();else resp()}return}
 for(const k in pw)if(pw[k]>0)pw[k]-=dt;pl.cd-=dt;pl.inv-=dt;pl.hp-=dt;
 const ax=inp.r-inp.l,tv=ax*(pw.v>0?9.5:6.5),a=(pl.ground?70:45)*dt;
 pl.vx+=cl(tv-pl.vx,-a,a);if(ax)pl.fc=ax>0?1:-1;
 pl.coy=pl.ground?.1:pl.coy-dt;pl.buf-=dt;
 if(inp.jp){pl.buf=.12;inp.jp=false}
 if(inp.pw){inp.pw=0;use()}
 if(pl.buf>0&&pl.coy>0){pl.vy=13;pl.coy=0;pl.buf=0;pl.ground=null;sfx.jump();pl.sq=-1}
 if(!inp.j&&pl.vy>3)pl.vy-=45*dt;
 pl.vy=Math.max(-22,pl.vy-26*dt);
 const pv=pl.vy;mv(pl,dt);
 if(pl.ground&&pv<-3)pl.sq=.8;
 if(pl.ground&&pl.ground.t=='g')pl.safe=pl.ground;
 if(pl.hh){const s=pl.hh;pl.hh=null;bump(s)}
 for(const h of hid)if(!h.on&&pl.vy>0&&ov_(pl,h)){h.on=1;pl.y=h.y-pl.h;pl.vy=-1;sol.push({x:h.x,y:h.y,w:1,h:1,t:'u',b:.2});for(let i=0;i<3;i++){save.coins++;score+=10}sfx.coin();txt(h.x+.5,h.y+1.4,'SEGREDO +30');spark(h.x+.5,h.y+1,14,'#fc0')}
 if(pl.x<-5.6){pl.x=-5.6;pl.vx=Math.max(0,pl.vx)}
 if(pl.y<-1.7){die();return}
 for(const f of cp)if(!f.on&&pl.x>f.x){f.on=1;sfx.pow();txt(f.x,3,'CHECKPOINT');spark(f.x,2,12,'#4f4')}
 for(let i=it.length-1;i>=0;i--){const o=it[i];o.vy-=26*dt;mv(o,dt);if(o.ground&&o.ground.t=='g')o.vx=0;
  if(o.y<-3){it.splice(i,1);continue}
  if(ov_({x:pl.x,w:pl.w,y:pl.y,h:pl.h},{x:o.x-.4,w:.8,y:o.y,h:.8})){give(o.t);it.splice(i,1)}}
 for(let i=fb.length-1;i>=0;i--){const f=fb[i];f.l-=dt;if(!f.h)f.vy-=40*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;
  if(!f.h&&f.vy<0&&solidAt(f.x,f.y-.2)){f.vy=7;f.y+=.2}
  if(f.l<=0||solidAt(f.x,f.y)&&f.h==0&&Math.abs(f.vy)<30&&solidAt(f.x+f.vx*.03,f.y+.1)||f.y<-3){fb.splice(i,1);continue}
  if(f.h){if(Math.abs(f.x-pl.x)<.5&&f.y>pl.y&&f.y<pl.y+pl.h){hurtP();fb.splice(i,1)}continue}
  for(const e of en)if(!e.dead&&Math.abs(e.x-f.x)<e.w/2+.3&&f.y>e.y&&f.y<e.y+e.h){killE(e,150);fb.splice(i,1);break}}
 for(const e of en){if(e.dead){e.dead-=dt;continue}e.inv-=dt;e.tm+=dt;
  if(e.t=='f'){e.x=e.ox+sn(e.tm*1.2)*3;e.y=e.oy+sn(e.tm*2.4)*.5;e.dir=Math.cos(e.tm*1.2)>0?1:-1}
  else{const dx=pl.x-e.x,near=Math.abs(dx)<4&&Math.abs(e.y-pl.y)<1.5&&e.t=='w';let go=1;
   if(e.t=='B'){e.dir=Math.sign(dx)||e.dir;go=Math.abs(dx)<14?.7:0;e.jt-=dt;if(e.jt<=0&&e.ground){e.vy=14;e.jt=2.2}
    e.st-=dt;if(e.st<=0&&Math.abs(dx)<16){fb.push({x:e.x,y:e.y+1.6,vx:e.dir*6,vy:0,l:3,h:1});e.st=2.4}}
   else if(e.t=='j'){e.jt-=dt;if(e.jt<=0&&e.ground){e.vy=11;e.jt=1.6}go=e.ground?0:1}
   else{if(near)e.dir=Math.sign(dx)||e.dir;
    if(e.ground&&!solidAt(e.x+e.dir*(e.w/2+.15),e.y-.25)){if(near)go=0;else e.dir=-e.dir}}
   e.vx=go*e.dir*e.sp*(near?1.5:1);e.vy=Math.max(-20,e.vy-26*dt);if(mv(e,dt)&&e.t!='B')e.dir=-e.dir;
   if(arena&&e.t=='B')e.x=cl(e.x,arena.x+2,arena.x+arena.w-2);if(e.y<-4)e.dead=.01}
  if(Math.abs(pl.x-e.x)<(pl.w+e.w)/2&&pl.y<e.y+e.h&&pl.y+pl.h>e.y){
   if(pw.s>0&&e.t!='B'){killE(e,200)}
   else if(pl.vy<0&&pl.y>e.y+e.h*.45&&e.t!='s'){killE(e);pl.vy=inp.j?13:9;pl.ground=null}
   else{hurtP();if(pl.inv>0&&e.t!='B')pl.vx=(pl.x<e.x?-1:1)*6}}}
 if(pl.x>goalX-.3&&(!bossLv||bd))win();
}

/* ===== ESTADOS / UI ===== */
function ov(h){const o=$('ov');o.innerHTML=h;o.style.display=h?'flex':'none';document.body.className=state=='play'?'play':''}

function play(n,fresh){ac();try{(document.documentElement.requestFullscreen?.()||Promise.resolve()).catch(()=>{});screen.orientation?.lock?.('landscape')?.catch(()=>{})}catch(e){}
 lvl=cl(n,1,100);score=fresh?0:save.score;build(lvl);resetP();lives=3;inp.l=inp.r=inp.j=0;cam=-6;state='play';hud();ov('');$('bp').textContent='⏸'}

function resume(){state='play';ov('');$('bp').textContent='⏸'}
function fin(){save.score=score;if(score>save.hi)save.hi=score;store()}
function win(){state='win';score+=lives*100+200;sfx.win();if(lvl<100)save.lvl=Math.max(save.lvl,lvl+1);fin();
 ov('<h2>🏆 FASE '+lvl+' COMPLETA!</h2><p>Pontos: '+score+' · Recorde: '+save.hi+'</p>'+(lvl<100?'<button onclick="play(lvl+1)">PRÓXIMA FASE</button>':'<p>Terminaste as 100 fases! Parabéns!</p>')+'<button onclick="menu()">MENU</button>')}
function lose(){state='lose';sfx.lose();fin();ov('<h2>💀 DERROTA</h2><p>Pontos: '+score+' · Recorde: '+save.hi+'</p><button onclick="play(lvl)">TENTAR DE NOVO</button><button onclick="menu()">MENU</button>')}
